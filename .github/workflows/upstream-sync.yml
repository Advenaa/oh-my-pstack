name: Sync upstream pstack

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-pstack-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply safe upstream update
        id: sync
        run: |
          node scripts/sync-upstream.mjs --apply | tee sync.log
          if grep -q "Upstream moved" sync.log; then
            echo "drift=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Annotate the protected files upstream moved
        if: steps.sync.outputs.drift == '1'
        run: |
          echo "::warning title=Upstream changed files this port owns::The daily updater never writes them. Merge by hand, then advance the pin. Run: node scripts/sync-upstream.mjs --apply --dry-run"
          sed -n '/Upstream moved/,$p' sync.log

      - name: Verify package
        run: npm run verify

      - name: Test updater
        run: npm run test:sync

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Test bundled scripts
        run: |
          bun install --cwd skills/poteto-mode/scripts --frozen-lockfile
          bun test watch-pr check-plan.test.ts
          bunx tsc --project skills/poteto-mode/scripts/watch-pr/tsconfig.json --noEmit --strict

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync upstream pstack"
          title: "chore: sync upstream pstack"
          body: |
            Automated update from the pinned authoritative Cursor pstack source.

            The updater writes only upstream-owned files, translating Cursor bindings
            to omp ones. Files the port owns are reported in the step log when upstream
            changed them, because those need a hand merge before the pin advances.
          branch: automation/upstream-pstack
          delete-branch: true
